name: Live AI

# Plays one real `spook ai-gm` round against live chat-completions providers.
# The round itself is crates/spook/tests/integration/live_round.rs (ignored by default).
#
# - ollama: a tiny local model on the runner. No key, no cost. Runs on PRs and
#   main pushes that touch the model host, and on demand.
# - xai: the same round against api.x.ai with the XAI_API_KEY repo secret
#   (passed to spook as SPOOK_GM_KEY).
#   Weekly and on demand only, never on PRs. Skips with a notice when the
#   secret is not set. The model defaults to XAI_DEFAULT_MODEL below and can be
#   overridden with the SPOOK_XAI_MODEL repo variable.

on:
  pull_request:
    branches: [main]
    paths:
      - crates/agent/**
      - crates/cli/**
      - crates/protocol/gm.rs
      - crates/spook/tests/integration/live_round.rs
      - .github/workflows/live-ai.yml
  push:
    branches: [main]
    paths:
      - crates/agent/**
      - crates/cli/**
      - crates/protocol/gm.rs
      - crates/spook/tests/integration/live_round.rs
      - .github/workflows/live-ai.yml
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_VERSION: v0.40.3
  OLLAMA_MODEL: qwen2.5:0.5b
  XAI_DEFAULT_MODEL: grok-4.20-0309-non-reasoning

jobs:
  ollama:
    name: ollama (${{ github.event_name }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Build the live round
        run: cargo test -p spook --test integration --locked --no-run

      - name: Cache Ollama and the model
        uses: actions/cache@v4
        with:
          path: |
            ~/.ollama-bin
            ~/.ollama/models
          key: ollama-${{ env.OLLAMA_VERSION }}-${{ env.OLLAMA_MODEL }}

      - name: Install Ollama (CPU only)
        run: |
          if [ ! -x ~/.ollama-bin/bin/ollama ]; then
            mkdir -p ~/.ollama-bin
            curl -fsSL "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
              | zstd -dc \
              | tar -x -C ~/.ollama-bin --exclude='*cuda*' --exclude='*vulkan*' --exclude='*mlx*' --exclude='*rocm*'
          fi
          ~/.ollama-bin/bin/ollama --version || true

      - name: Start Ollama and pull the model
        run: |
          nohup ~/.ollama-bin/bin/ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/version && break
            sleep 1
          done
          ~/.ollama-bin/bin/ollama pull "$OLLAMA_MODEL" 2>&1 | tail -n 2
          ~/.ollama-bin/bin/ollama list

      - name: Play one round against Ollama
        env:
          SPOOK_GM_KEY: ollama
          SPOOK_GM_URL: http://127.0.0.1:11434/v1
          SPOOK_GM_MODEL: ${{ env.OLLAMA_MODEL }}
        run: cargo test -p spook --test integration "live_round::" --locked -- --ignored --nocapture

      - name: Ollama log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/ollama.log" || true

  xai:
    name: xai
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for the XAI_API_KEY secret
        id: key
        env:
          SPOOK_GM_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$SPOOK_GM_KEY" ]; then
            echo "::notice title=xAI round skipped::The XAI_API_KEY repo secret is not set. Add it to run the xAI round."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'

      - run: rustup toolchain install && rustc --version
        if: steps.key.outputs.present == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.present == 'true'

      - name: Play one round against xAI
        if: steps.key.outputs.present == 'true'
        env:
          SPOOK_GM_KEY: ${{ secrets.XAI_API_KEY }}
          SPOOK_GM_URL: https://api.x.ai/v1
          SPOOK_GM_MODEL: ${{ vars.SPOOK_XAI_MODEL || env.XAI_DEFAULT_MODEL }}
        run: cargo test -p spook --test integration "live_round::" --locked -- --ignored --nocapture
