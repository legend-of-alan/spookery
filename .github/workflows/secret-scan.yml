name: Secret scan

# Runs on every PR and main push, with no path filter, so a key pasted into
# any file (docs included) is caught.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # gitleaks 8.30.1. `detect` with no commit range reads every commit
      # in this clone.
      - name: gitleaks
        run: |
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$file" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --redact --exit-code=1
