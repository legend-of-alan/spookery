name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Skip CI when a change only touches plain-prose docs or images.
      # Any other doc runs CI, since tests read some docs.
      - "README.md"
      - "docs/README.md"
      - "docs/first-pack.md"
      - "**/*.png"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/README.md"
      - "docs/first-pack.md"
      - "**/*.png"
      - "**/*.svg"

permissions:
  contents: read

concurrency:
  # PRs share one group per branch, so a new push cancels the old run.
  # Each push to main gets its own group (by sha), so every main commit
  # runs to completion and none is replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes cost more than Linux, so PRs run Linux
        # only. Every push to main still runs all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Keep checkout line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --locked

      - name: test
        run: cargo test --workspace --locked

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # gitleaks 8.30.1. `detect` with no commit range reads every commit
      # in this clone.
      - name: gitleaks
        run: |
          version=8.30.1
          file="gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$file"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$file" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --redact --exit-code=1
