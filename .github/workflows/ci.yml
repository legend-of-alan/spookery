name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Skip CI when a change only touches plain-prose docs or images.
      # Any other doc runs CI, since tests read some docs.
      - "docs/README.md"
      - "**/*.png"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/README.md"
      - "**/*.png"
      - "**/*.svg"
  # Lets a branch run the full matrix by hand: gh workflow run CI --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share one group per branch, so a new push cancels the old run.
  # Each push to main gets its own group (by sha), so every main commit
  # runs to completion and none is replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes cost more than Linux, so PRs run Linux
        # only. Every push to main still runs all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Keep checkout line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        # macOS builds the same unix code as Linux, so it skips clippy. Windows keeps it
        # for the cfg(windows) code in engine/store/durability.rs.
        if: runner.os != 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --locked

      - name: dependency-and-feature-checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo tree -e normal -p spookery-cli --locked | (! grep -E 'spookery-engine|spookery-server')
          cargo tree -e normal -p spookery-agent --locked | (! grep -E 'spookery-(engine|server|cli)|tokio|reqwest|socket2')
          # spookery-protocol is MIT: every license in its tree must be permissive.
          cargo tree -e normal -p spookery-protocol --locked --target all --prefix none --no-dedupe --format '{l}' | tr -d '()' | tr ' ' '\n' | (! grep -vxE 'OR|AND|MIT|Apache-2.0|Unlicense|Unicode-3.0|BSD-2-Clause|BSD-3-Clause|ISC|Zlib')
          cargo tree -e normal -p spookery-server --locked | (! grep -E 'spookery-cli|spookery-agent|reqwest')
          cargo tree -e normal -p spook --no-default-features --features client --locked | (! grep -E 'spookery-engine|spookery-server')
          cargo tree -e normal -p spook --no-default-features --features server --locked | (! grep -E 'spookery-cli|spookery-agent|reqwest')
          cargo build -p spook --no-default-features --features server --locked
          cargo build -p spook --no-default-features --features client --locked
          cargo build -p spook --locked

      - name: test
        run: cargo test --workspace --locked
