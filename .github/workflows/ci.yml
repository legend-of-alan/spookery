name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      # Skip CI when a change only touches plain-prose docs or images.
      # Any other doc runs CI, since tests read some docs.
      - "docs/README.md"
      - "**/*.png"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/README.md"
      - "**/*.png"
      - "**/*.svg"
  # Lets a branch run the full matrix by hand: gh workflow run CI --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs share one group per branch, so a new push cancels the old run.
  # Each push to main gets its own group (by sha), so every main commit
  # runs to completion and none is replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Windows minutes cost more than Linux, so PRs run Linux
        # only. Every push to main still runs all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - name: Keep checkout line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # HEAD^ is the base: the PR's merge commit's first parent, or main before a squash merge.
          fetch-depth: 2

      - run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        # macOS builds the same unix code as Linux, so it skips clippy. Windows keeps it
        # for the cfg(windows) code in engine/store/durability.rs.
        if: runner.os != 'macOS'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: build
        run: cargo build --workspace --locked

      - name: demo pack
        # No scenario plays the demo, so this only checks that the shipped pack loads.
        run: cargo run -p spook --locked -- check packs/demo-d20

      - name: dependency-and-feature-checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo tree -e normal -p spookery-engine --locked | (! grep -E 'tracing-subscriber')
          cargo tree -e normal -p spookery-client --locked | (! grep -E 'spookery-engine|spookery-server|rmcp|tracing-subscriber')
          cargo tree -e normal -p spookery-agent --locked | (! grep -E 'spookery-(engine|server|client)|reqwest|rmcp|socket2|mio|tokio-macros|tracing-subscriber')
          # The agent awaits its adapters on the caller's runtime: it never builds, enters or blocks on one.
          (! grep -rnE 'tokio::runtime|Handle::current|block_on|spawn_blocking' crates/agent --include='*.rs')
          # Naming rule 8: in each Rust file this change touches, no type, trait or function name starts
          # or ends with its module's name, unless it is that name (query::Query). A marker counts on the
          # name's line or the next one, where rustfmt moves a comment that follows an opening brace.
          for f in $(git diff --name-only --diff-filter=d HEAD^ HEAD -- '*.rs'); do
            m=$(basename "$f" .rs); [ "$m" = mod ] && m=$(basename "$(dirname "$f")")
            [[ $m =~ ^(lib|main|build)$ ]] && continue
            awk -v m="$m" -v M="$(sed -E 's/(^|_)(.)/\U\2/g' <<< "$m")" 'pending && !/\/\/ repeats module: ./ { print pending; bad = 1 } { pending = "" }
              !/\/\/ repeats module: ./ && match($0, /^(pub(\([^)]*\))? )?((const|async|unsafe) )*(struct|enum|trait|type|union|fn) [A-Za-z0-9_]+/) {
                n = substr($0, 1, RLENGTH); sub(/.* /, "", n); snake = n ~ /^[a-z]/; w = snake ? m : M
                if (n != w && (n ~ ("^" w (snake ? "_" : "[A-Z_]")) || n ~ ((snake ? "_" : "") w "$"))) pending = FILENAME ":" FNR ": " n " repeats its module " m
              } END { if (pending) { print pending; bad = 1 } exit bad }' "$f" || repeats=1
          done
          [ -z "$repeats" ] || { echo "Rename each one, or end its line with '// repeats module: <reason>' (CONTRIBUTING.md Naming rule 8)."; exit 1; }
          # protocol, agent and client are MIT: every AND term of every license in their
          # trees must offer a permissive choice.
          for crate in spookery-protocol spookery-agent spookery-client; do
            cargo tree -e normal -p "$crate" --locked --target all --prefix none --no-dedupe --format '{l}' | sort -u | awk -v crate="$crate" '
              { terms = $0; gsub(/[()]/, "", terms); gsub(/ *\/ */, " OR ", terms)
                n = split(terms, ands, / AND /)
                for (i = 1; i <= n; i++) {
                  free = 0; m = split(ands[i], ors, / OR /)
                  for (j = 1; j <= m; j++) if (ors[j] ~ /^ *(MIT|Apache-2\.0( WITH LLVM-exception)?|Unlicense|Unicode-3\.0|BSD-2-Clause|BSD-3-Clause|ISC|Zlib|BSL-1\.0) *$/) free = 1
                  if (!free) { print crate ": " $0; bad = 1 }
                }
              }
              END { exit bad }'
          done
          cargo tree -e normal -p spookery-server --locked | (! grep -E 'spookery-client|spookery-agent|reqwest|tracing-subscriber')
          # Only the `spook play` and `spook gm` terminals print. Library code hands output to a writer.
          (! grep -rnE '\b(e?print(ln)?!|io::std(out|err)\(\))' crates/{engine,protocol,agent,server,client} --include='*.rs' | grep -vE '^crates/client/(play|gm)\.rs:')
          cargo tree -e normal -p spook --no-default-features --features client --locked | (! grep -E 'spookery-engine|spookery-server')
          cargo tree -e normal -p spook --no-default-features --features server --locked | (! grep -E 'spookery-client|spookery-agent|reqwest')
          cargo build -p spook --no-default-features --features server --locked
          cargo build -p spook --no-default-features --features client --locked
          cargo build -p spook --locked

      - name: test
        run: cargo test --workspace --locked

  compatibility-replay:
    # Replays crates/protocol/sessions/v2.jsonl, a session recorded against the previous
    # release, against this build. Compatibility in docs/seat-protocol.md says what may change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: replay
        # A filter that matches no scenario exits 0, so the job also needs the one it names,
        # "A recorded session replays against this build", to have run and passed.
        shell: bash
        run: |
          cargo test -p spook --locked --test features_host -- --name "recorded session" | tee replay.log
          grep -q "^1 scenario (1 passed)" replay.log
