schema: verbs
rules:
  - id: wait
    when:
      verb: wait
    do: []

  - id: travel
    when:
      verb: travel
      target: exit
    do:
      - location:
          via: target

  - id: grit
    when:
      verb: grit
    roll:
      check: grit
      target: 0
    do: []

  - id: take
    when:
      verb: take
      target: item
    do:
      - item:
          who: here
          id: target
          add: -1
      - item:
          who: self
          id: target
          add: 1

  - id: drop
    when:
      verb: drop
      target: item
    do:
      - item:
          who: self
          id: target
          add: -1
      - item:
          who: here
          id: target
          add: 1

  - id: use
    when:
      verb: use
      target: item
    if:
      - has_item:
          who: self
          id: target
    do: []

  - id: wield
    when:
      verb: wield
      target: item
    do:
      - wield:
          who: self
          id: target

  - id: unwield
    when:
      verb: unwield
    do:
      - unwield:
          who: self
