schema: verbs
rules:
  - id: wait
    when:
      verb: wait
    do: []

  - id: travel
    when:
      verb: travel
      target: exit
    do:
      - location:
          via: target

  - id: strike
    when:
      verb: strike
      target: actor
    roll:
      check: strike
      threshold: 38
      partial_at: 32
    success:
      - meter:
          of: target
          key: hp
          add: "-(self.might / 10)"
    partial:
      - meter:
          of: target
          key: hp
          add: -1

  - id: take
    when:
      verb: take
      target: item
    do:
      - item:
          of: here
          id: target
          add: -1
      - item:
          of: self
          id: target
          add: 1

  - id: drop
    when:
      verb: drop
      target: item
    do:
      - item:
          of: self
          id: target
          add: -1
      - item:
          of: here
          id: target
          add: 1

  - id: wield
    when:
      verb: wield
      target: item
    do:
      - wield:
          of: self
          id: target

  - id: unwield
    when:
      verb: unwield
    do:
      - unwield:
          of: self

  - id: chock
    when:
      verb: chock
    if:
      - at:
          of: self
          place: gate_yard
      - has_item:
          of: self
          id: chock
    cost:
      items:
        chock: 1
    do:
      - flag:
          of: world
          key: chocked
          value: true
      - narrate:
          to: self
          text: The wheel holds. The cart settles.
