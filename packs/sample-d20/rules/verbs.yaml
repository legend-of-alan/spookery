schema: verbs
rules:
  - id: wait
    when:
      verb: wait
    do: []

  - id: travel
    when:
      verb: travel
      target: exit
    do:
      - location:
          via: target

  - id: strike
    when:
      verb: strike
      target: actor
    roll:
      check: strike
      target: 38
      partial_at: 32
    success:
      - meter:
          who: target
          key: hp
          add: "-(self.might / 10)"
    partial:
      - meter:
          who: target
          key: hp
          add: -1

  - id: drink
    when:
      verb: drink
    if:
      - has_item:
          who: self
          id: tonic
    cost:
      items:
        tonic: 1
    do:
      - meter:
          who: self
          key: hp
          add: 4

  - id: take
    when:
      verb: take
      target: item
    do:
      - item:
          who: here
          id: target
          add: -1
      - item:
          who: self
          id: target
          add: 1

  - id: drop
    when:
      verb: drop
      target: item
    do:
      - item:
          who: self
          id: target
          add: -1
      - item:
          who: here
          id: target
          add: 1

  - id: use
    when:
      verb: use
      target: item
    if:
      - has_item:
          who: self
          id: target
    do: []

  - id: wield
    when:
      verb: wield
      target: item
    do:
      - wield:
          who: self
          id: target

  - id: unwield
    when:
      verb: unwield
    do:
      - unwield:
          who: self

  - id: chock
    when:
      verb: chock
    if:
      - at:
          who: self
          place: gate_yard
      - has_item:
          who: self
          id: chock
    cost:
      items:
        chock: 1
    do:
      - flag:
          who: world
          key: chocked
          value: true
      - narrate:
          to: self
          text: The wheel holds. The cart settles.

  - id: ask_briar
    when:
      verb: ask_briar
    if:
      - at:
          who: self
          place: gate_yard
      - at:
          who: npc_briar
          place: gate_yard
    do:
      - flag:
          who: world
          key: passage
          value: true
      - narrate:
          to: self
          text: Briar steps aside.
