schema: story
id: ending
rules:
  - id: lane_clear
    when:
      change:
        arrive: mill_lane
        subject: pc
    if:
      - not:
          has_item:
            of: self
            id: nail
    do:
      - flag:
          of: world
          key: finished
          value: true
      - narrate:
          to: self
          text: Nell is on the lane. That is the end.
  - id: lane_clear_nail_kept
    when:
      change:
        arrive: mill_lane
        subject: pc
    if:
      - has_item:
          of: self
          id: nail
    do:
      - flag:
          of: world
          key: finished
          value: true
      - narrate:
          to: self
          text: The nail is still in Corin's pocket, unspent. Oden will remember who put a shoulder to his cart. That is the end.
