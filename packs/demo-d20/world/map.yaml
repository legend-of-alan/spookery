schema: map
paths:
  - path: yard -> lane
    id: gate
    name: gate
    cost:
      ticks: 15
    if:
      - flag: { of: world, id: passage, is: true }
      - not:
          flag: { of: world, id: lost, is: true }
    locked_text: Briar keeps the gate shut.
  - path: yard -> lane
    id: cart
    name: cart
    cost:
      ticks: 15
    if:
      - flag: { of: world, id: wheel_set, is: true }
      - not:
          flag: { of: world, id: lost, is: true }
    locked_text: The cart won't move.
  - path: lane -> yard
  - path: yard <-> loft
  - path: yard <-> shed
