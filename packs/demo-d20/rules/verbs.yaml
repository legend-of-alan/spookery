schema: verbs
rules:
  - id: wait
    when:
      verb_id: wait
    do: []

  - id: travel
    when:
      verb_id: travel
      target: path
    do:
      - location:
          via: target
      - meter:
          of: world
          id: daylight
          add: -1

  - id: take
    when:
      verb_id: take
      target: item
    do:
      - item:
          of: here
          id: target
          add: -1
      - item:
          of: self
          id: target
          add: 1

  - id: drop
    when:
      verb_id: drop
      target: item
    do:
      - item:
          of: self
          id: target
          add: -1
      - item:
          of: here
          id: target
          add: 1

  - id: wield
    when:
      verb_id: wield
      target: item
    do:
      - wield:
          subject: self
          id: target

  - id: unwield
    when:
      verb_id: unwield
    do:
      - unwield:
          subject: self

  - id: ward
    when:
      verb_id: ward
    if:
      - at:
          subject: self
          place_id: yard
      - has_item:
          subject: self
          id: nail
    cost:
      items:
        nail: 1
    do:
      - flag:
          of: world
          id: wheel_set
          value: true
      - narrate:
          to: self
          text: You drive the nail into the hub. The wheel holds.

  - id: brace
    when:
      verb_id: brace
    if:
      - at:
          subject: self
          place_id: shed
      - at:
          subject: oden
          place_id: shed
      - has_item:
          subject: self
          id: nail
    cost:
      ticks: 15
    do:
      - flag:
          of: world
          id: wheel_set
          value: true
      - meter:
          of: world
          id: daylight
          add: -3
      - narrate:
          to: self
          text: Oden reads the rune on your nail, nods, and carries a brace out to the cart with you. The wheel holds, and the sun drops low behind the mill.
