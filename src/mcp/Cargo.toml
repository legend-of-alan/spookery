[package]
name = "spookery-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
rmcp = "0.8"
rmcp-macros = "0.8"
spookery-kernel = { path = "../kernel" }
spookery-tick = { path = "../tick" }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
