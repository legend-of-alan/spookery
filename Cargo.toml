[workspace]
resolver = "2"
members = [".", "src/kernel", "src/tick", "ai", "protocol", "cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-or-later"

[package]
name = "spookery"
version.workspace = true
autotests = false
autobins = false
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "spook"
path = "src/main.rs"

[dependencies]
spookery-ai = { path = "ai" }
spookery-cli = { path = "cli" }
spookery-kernel = { path = "src/kernel" }
spookery-protocol = { path = "protocol" }
spookery-tick = { path = "src/tick" }
rmcp = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[dev-dependencies]
spookery-ai = { path = "ai" }
spookery-kernel = { path = "src/kernel" }
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
serde-saphyr = "=1.3.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }
cucumber = "=0.23.0"

[[test]]
name = "promises"
path = "tests/promises.rs"
harness = false
