[workspace]
resolver = "2"
members = ["crates/kernel", "crates/protocol", "crates/round", "crates/spook"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-or-later"

# Small binaries for release downloads: `cargo build --profile dist`.
# Plain `release` stays fast for local builds.
[profile.dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1

# Line tables keep file:line in backtraces; full debug info made test
# binaries huge and Windows links very slow. Set CARGO_PROFILE_DEV_DEBUG=true
# locally if you need a debugger.
[profile.dev]
debug = "line-tables-only"
