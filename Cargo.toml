[workspace]
resolver = "2"
members = [".", "src/kernel", "src/tick", "src/mcp"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-or-later"

[package]
name = "spookery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "spook"
path = "src/cli/main.rs"

[[bin]]
name = "spookery"
path = "src/cli/main.rs"

[dependencies]
spookery-kernel = { path = "src/kernel" }
spookery-mcp = { path = "src/mcp" }
spookery-tick = { path = "src/tick" }
rmcp = "0.8"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[dev-dependencies]
spookery-kernel = { path = "src/kernel" }
jsonschema = "0.30"
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "=1.3.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[[test]]
name = "import_boundaries"
path = "tests/conformance/import_boundaries.rs"

