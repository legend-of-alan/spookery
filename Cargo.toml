[workspace]
resolver = "2"
members = [".", "src/kernel", "src/tick", "src/mcp"]

[workspace.package]
edition = "2021"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-or-later"

[package]
name = "spookery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "spook"
path = "src/cli/main.rs"

[[bin]]
name = "spookery"
path = "src/cli/main.rs"

[dependencies]
spookery-kernel = { path = "src/kernel" }
spookery-mcp = { path = "src/mcp" }
spookery-tick = { path = "src/tick" }

[dev-dependencies]
spookery-kernel = { path = "src/kernel" }
jsonschema = "0.30"
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "=1.3.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[[test]]
name = "import_boundaries"
path = "tests/conformance/import_boundaries.rs"

[[test]]
name = "tick_01_closed_secret"
path = "tests/conformance/tick_01_closed_secret.rs"

[[test]]
name = "tick_02_no_self_win"
path = "tests/conformance/tick_02_no_self_win.rs"

[[test]]
name = "tick_06_atomic_commit"
path = "tests/conformance/tick_06_atomic_commit.rs"

[[test]]
name = "tick_09_tool_scope"
path = "tests/conformance/tick_09_tool_scope.rs"

[[test]]
name = "tick_10_proposal_only"
path = "tests/conformance/tick_10_proposal_only.rs"

[[test]]
name = "product_01_load_mcp"
path = "tests/conformance/product_01_load_mcp.rs"

[[test]]
name = "canon_schemas"
path = "tests/conformance/canon_schemas.rs"

[[test]]
name = "pack_rev_refusal"
path = "tests/conformance/pack_rev_refusal.rs"

[[test]]
name = "emitter_sample"
path = "tests/conformance/emitter_sample.rs"

[[test]]
name = "docks_bytes"
path = "tests/conformance/docks_bytes.rs"

[[test]]
