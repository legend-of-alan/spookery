[package]
name = "spookery-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-core = "0.3"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = { version = "0.6", features = ["all"] }
spookery-engine = { path = "../engine" }
spookery-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }
