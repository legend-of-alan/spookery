[package]
name = "spookery-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
[lib]
path = "lib.rs"
[dependencies]
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spookery-agent = { path = "../agent" }
spookery-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync"] }
