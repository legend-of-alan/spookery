schema: verbs
rules:
  - id: wait
    when:
      verb_id: wait
    do: []

  - id: travel
    when:
      verb_id: travel
      target: path
    do:
      - location:
          via: target

  - id: steady
    when:
      verb_id: steady
    check:
      total: 2d6 + self.nerve
      success_at: 0
    do: []

  - id: take
    when:
      verb_id: take
      target: item
    do:
      - item:
          of: here
          id: target
          add: -1
      - item:
          of: self
          id: target
          add: 1

  - id: drop
    when:
      verb_id: drop
      target: item
    do:
      - item:
          of: self
          id: target
          add: -1
      - item:
          of: here
          id: target
          add: 1

  - id: wield
    when:
      verb_id: wield
      target: item
    do:
      - wield:
          subject: self
          id: target

  - id: unwield
    when:
      verb_id: unwield
    do:
      - unwield:
          subject: self
