[package]
name = "spook"
version.workspace = true
autotests = false
autobins = false
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "spookery"
path = "src/lib.rs"

[[bin]]
name = "spook"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
rmcp = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = { version = "0.6", features = ["all"] }
spookery-kernel = { path = "../kernel" }
spookery-tick = { path = "../tick" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "sync"] }

[dev-dependencies]
cucumber = "=0.23.0"
rmcp = { version = "0.8", features = ["client", "transport-child-process"] }
serde-saphyr = "=1.3.0"
serde_json = "1"
spookery-kernel = { path = "../kernel" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

[[test]]
name = "promises"
path = "tests/promises.rs"
harness = false
