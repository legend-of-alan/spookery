[package]
name = "spook"
version.workspace = true
autotests = false
autobins = false
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "spookery"
path = "src/lib.rs"

[[bin]]
name = "spook"
path = "src/main.rs"

[features]
default = ["server", "client"]
server = ["dep:spookery-engine", "dep:spookery-server", "dep:serde_json"]
client = ["dep:spookery-cli"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
spookery-cli = { path = "../cli", optional = true }
spookery-engine = { path = "../engine", optional = true }
spookery-protocol = { path = "../protocol" }
spookery-server = { path = "../server", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[dev-dependencies]
cucumber = "=0.23.0"
reqwest = { version = "0.12", features = ["blocking"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde-saphyr = "=1.3.0"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
spookery-engine = { path = "../engine", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[[test]]
name = "features_host"
path = "tests/features_host.rs"
harness = false

[[test]]
name = "features_world"
path = "tests/features_world.rs"
harness = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"
