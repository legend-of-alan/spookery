[package]
name = "spook"
version.workspace = true
autotests = false
autobins = false
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "spookery"
path = "src/lib.rs"

[[bin]]
name = "spook"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
futures-core = "0.3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
socket2 = { version = "0.6", features = ["all"] }
spookery-kernel = { path = "../kernel" }
spookery-protocol = { path = "../protocol" }
spookery-round = { path = "../round" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "net", "io-util", "io-std", "sync"] }

[dev-dependencies]
cucumber = "=0.23.0"
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde-saphyr = "=1.3.0"
serde_json = "1"
spookery-kernel = { path = "../kernel" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "features_host"
path = "tests/features_host.rs"
harness = false

[[test]]
name = "features_world"
path = "tests/features_world.rs"
harness = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"
