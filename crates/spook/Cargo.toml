[package]
name = "spook"
version.workspace = true
autotests = false
autobins = false
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "spookery"
path = "src/lib.rs"

[[bin]]
name = "spook"
path = "src/main.rs"

[features]
default = ["host", "client"]
host = ["dep:spookery-engine", "dep:spookery-host", "dep:serde_json"]
client = ["dep:spookery-agent", "dep:spookery-client"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["now"] }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
spookery-agent = { path = "../agent", optional = true }
spookery-client = { path = "../client", optional = true }
spookery-engine = { path = "../engine", optional = true }
spookery-host = { path = "../host", optional = true }
spookery-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log"] }

[dev-dependencies]
cucumber = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
serde-saphyr = "2.2"
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
spookery-engine = { path = "../engine", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[[test]]
name = "features_host"
path = "tests/features_host.rs"
harness = false

[[test]]
name = "features_world"
path = "tests/features_world.rs"
harness = false

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[lints]
workspace = true
