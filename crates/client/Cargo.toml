[package]
name = "spookery-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"
[lib]
path = "lib.rs"
[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
spookery-agent = { path = "../agent" }
spookery-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["macros", "rt", "time", "net", "io-util", "sync", "signal"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
